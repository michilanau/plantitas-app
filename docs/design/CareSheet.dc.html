<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Figtree', system-ui, sans-serif; }
    a { color: #47583A; } a:hover { color: #374630; }

    .phone {
      width: 390px; height: 844px; position: relative; overflow: hidden;
      background: #FAF6EE; color: #2B2621; font-family: 'Figtree', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .serif { font-family: 'Newsreader', Georgia, serif; }

    /* dimmed screen behind the sheet */
    .behind { position: absolute; inset: 0; background: #FAF6EE; padding: 22px; }
    .behind .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #A79C88; }
    .behind h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 27px; margin: 3px 0 20px; }
    .ghostcard { height: 78px; border-radius: 20px; background: #F1EADB; margin-bottom: 10px; }
    .scrim { position: absolute; inset: 0; background: rgba(43,38,33,.34); }

    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: #FAF6EE; border-radius: 26px 26px 0 0; padding: 10px 20px 26px;
      box-shadow: 0 -12px 40px rgba(43,38,33,.18);
    }
    .grab { width: 40px; height: 4px; border-radius: 999px; background: #DAD0BB; margin: 4px auto 14px; }
    .sheet h2 { font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 21px; margin: 0 0 16px; }

    .sectionlabel { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5C6E48; margin: 0 0 9px; }
    .chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip { border: 1px solid #D8CEB4; background: transparent; border-radius: 999px; padding: 9px 15px; font-family: inherit; font-size: 13px; font-weight: 600; color: #6E6559; display: flex; align-items: center; gap: 6px; }
    .chip.on { background: #47583A; border-color: #47583A; color: #FAF6EE; }

    .fieldrow { display: flex; gap: 10px; margin-bottom: 14px; }
    .field { flex: 1; background: #FFFDF9; border: 1px solid #E3D9C0; border-radius: 14px; padding: 9px 14px; display: flex; align-items: center; gap: 10px; }
    .field .fico { color: #8A8072; flex: none; }
    .field .flabel { font-size: 11px; font-weight: 600; color: #A79C88; }
    .field .fvalue { font-size: 14.5px; color: #2B2621; margin-top: 1px; }

    .toggle { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; margin-bottom: 6px; }
    .toggle .tlabel { font-size: 14px; font-weight: 500; }
    .switch { width: 44px; height: 26px; border-radius: 999px; background: #7B9E6B; position: relative; flex: none; }
    .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 999px; background: #fff; }

    .full { background: #FFFDF9; border: 1px solid #E3D9C0; border-radius: 14px; padding: 9px 14px; margin-bottom: 18px; }
    .full .flabel { font-size: 11px; font-weight: 600; color: #A79C88; }
    .full .fvalue { font-size: 14.5px; margin-top: 2px; }

    .actions { display: flex; gap: 10px; }
    .btn { flex: 1; height: 50px; border-radius: 14px; border: 0; font-family: inherit; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-text { background: transparent; color: #6E6559; }
    .btn-primary { background: #47583A; color: #FAF6EE; }
  </style>
</helmet>

<div class="phone">
  <div class="behind">
    <div class="eyebrow">Salón · Monstera deliciosa</div>
    <h1>Editar planta</h1>
    <div class="ghostcard"></div>
    <div class="ghostcard"></div>
    <div class="ghostcard"></div>
  </div>
  <div class="scrim"></div>

  <div class="sheet">
    <div class="grab"></div>
    <h2 class="serif">Añadir cuidado</h2>

    <div class="sectionlabel">Tipo de cuidado</div>
    <div class="chiprow">
      <span class="chip on">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/></svg>
        Riego
      </span>
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v5l-4.5 9A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-2.9L14 8V3"/></svg>
        Abonado
      </span>
      <span class="chip">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12l-1.5 9a2 2 0 0 1-2 1.8H9.5a2 2 0 0 1-2-1.8L6 10Z"/><path d="M4 10c2-3 5-4 8-4s6 1 8 4"/></svg>
        Trasplante
      </span>
    </div>

    <div class="fieldrow">
      <div class="field">
        <span class="fico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v3M16 3v3"/></svg></span>
        <div><div class="flabel">Día de comienzo</div><div class="fvalue">9 sept 2025</div></div>
      </div>
      <div class="field">
        <span class="fico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <div><div class="flabel">Recordatorio</div><div class="fvalue">09:00</div></div>
      </div>
    </div>

    <div class="toggle">
      <span class="tlabel">Activar notificaciones</span>
      <span class="switch"></span>
    </div>

    <div class="full">
      <div class="flabel">Cada cuántos días</div>
      <div class="fvalue">7</div>
    </div>

    <div class="full">
      <div class="flabel">Cantidad (ml)</div>
      <div class="fvalue">250</div>
    </div>

    <div class="actions">
      <button class="btn btn-text">Cancelar</button>
      <button class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Guardar
      </button>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
